<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực đơn - Vị Nhà</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/thucDon.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main style="margin-top: 90px">
      <!-- ================= MENU ================= -->

      <div class="container">
        <div class="page-title">
          <h1>Danh sách món ngon</h1>

          <p>
            Khám phá hương vị quê nhà qua từng món cơm được chuẩn bị tỉ mỉ từ
            những nguyên liệu tươi ngon nhất trong ngày.
          </p>
        </div>

        <!-- ================= FILTER ================= -->

        <div class="filter-box">
          <form method="get" th:action="@{/thucDon}" class="row g-3">
            <div class="col-lg-4">
              <label for="keyword" class="form-label">TÊN MÓN</label>
              <div class="search-food">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                  id="keyword"
                  name="keyword"
                  type="text"
                  th:value="${keyword}"
                  placeholder="Tìm kiếm món ăn..."
                />
              </div>
            </div>

            <div class="col-lg-2">
              <label for="trangThai" class="form-label">TRẠNG THÁI</label>
              <select id="trangThai" name="trangThai" class="form-select">
                <option value="">Tất cả trạng thái</option>
                <option
                  value="HOAT_DONG"
                  th:selected="${trangThai == 'HOAT_DONG'}"
                >
                  HOAT_DONG
                </option>
                <option value="ACTIVE" th:selected="${trangThai == 'ACTIVE'}">
                  ACTIVE
                </option>
                <option
                  value="ĐANG_BÁN"
                  th:selected="${trangThai == 'ĐANG_BÁN'}"
                >
                  ĐANG_BÁN
                </option>
                <option
                  value="Đang bán"
                  th:selected="${trangThai == 'Đang bán'}"
                >
                  Đang bán
                </option>
                <option
                  value="NGUNG_BAN"
                  th:selected="${trangThai == 'NGUNG_BAN'}"
                >
                  Ngừng bán
                </option>
              </select>
            </div>

            <div class="col-lg-2">
              <label for="danhMucId" class="form-label">DANH MỤC</label>
              <select id="danhMucId" name="danhMucId" class="form-select">
                <option value="">Tất cả danh mục</option>
                <option
                  th:each="dm : ${danhSachDanhMuc}"
                  th:value="${dm.id}"
                  th:selected="${danhMucId != null and danhMucId == dm.id}"
                  th:text="${dm.ten}"
                >
                  Danh mục
                </option>
              </select>
            </div>

            <div class="col-lg-2">
              <label for="giaTu" class="form-label">GIÁ TỪ</label>
              <input
                id="giaTu"
                name="giaTu"
                type="number"
                min="0"
                step="1000"
                class="form-control"
                th:value="${giaTu}"
                placeholder="VD: 30000"
              />
            </div>

            <div class="col-lg-2">
              <label for="giaDen" class="form-label">GIÁ ĐẾN</label>
              <input
                id="giaDen"
                name="giaDen"
                type="number"
                min="0"
                step="1000"
                class="form-control"
                th:value="${giaDen}"
                placeholder="VD: 80000"
              />
            </div>

            <div class="col-lg-2">
              <label for="sapXepBan" class="form-label">SỐ LƯỢNG BÁN</label>
              <select id="sapXepBan" name="sapXepBan" class="form-select">
                <option value="">Mặc định</option>
                <option
                  value="BAN_NHIEU_NHAT"
                  th:selected="${sapXepBan == 'BAN_NHIEU_NHAT'}"
                >
                  Bán nhiều nhất
                </option>
                <option
                  value="BAN_IT_NHAT"
                  th:selected="${sapXepBan == 'BAN_IT_NHAT'}"
                >
                  Bán ít nhất
                </option>
              </select>
            </div>

            <div class="col-lg-12 d-flex justify-content-end gap-2">
              <button type="submit" class="btn btn-warning text-white">
                Lọc
              </button>
              <a th:href="@{/thucDon}" class="btn btn-outline-secondary"
                >Xóa lọc</a
              >
            </div>
          </form>
        </div>

        <!-- ================= PRODUCT GRID ================= -->

        <div class="row g-4 mt-3">
          <div class="col-lg-3 col-md-6" th:each="mon : ${danhSachMonAn}">
            <div class="food-card">
              <span class="rating"
                >⭐
                <span th:text="${mon.danhGia != null ? mon.danhGia : 0}"
                  >0</span
                ></span
              >

              <img
                th:src="@{${(mon.hinhAnhs != null and !#lists.isEmpty(mon.hinhAnhs) and mon.hinhAnhs[0].duongDan != null and mon.hinhAnhs[0].duongDan != '') ? ( #strings.startsWith(mon.hinhAnhs[0].duongDan, '/') ? mon.hinhAnhs[0].duongDan : '/' + mon.hinhAnhs[0].duongDan ) : '/images/comGa.png'}}"
                th:alt="${mon.ten}"
              />

              <div class="food-content">
                <h3 th:text="${mon.ten}">Tên món</h3>

                <p
                  th:text="${mon.moTa != null ? mon.moTa : 'Đang cập nhật mô tả...'}"
                >
                  Mô tả món ăn
                </p>

                <div class="food-bottom">
                  <span
                    class="price"
                    th:text="${#numbers.formatDecimal(mon.gia != null ? mon.gia : 0, 0, 'COMMA', 0, 'POINT')} + 'đ'"
                    >0đ</span
                  >

                  <span class="sold"
                    >Đã bán
                    <span th:text="${mon.daBan != null ? mon.daBan : 0}"
                      >0</span
                    ></span
                  >
                </div>

                <div class="food-btn">
                  <a
                    th:href="@{/chiTietMonAn(id=${mon.id})}"
                    class="detail-btn"
                  >
                    Chi tiết
                  </a>

                  <form
                    th:action="@{/gioHang/them}"
                    method="post"
                    style="display: inline"
                  >
                    <input type="hidden" name="monAnId" th:value="${mon.id}" />
                    <input type="hidden" name="soLuong" value="1" />
                    <button type="submit">
                      <i class="fa-solid fa-cart-plus"></i>
                      Thêm
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12" th:if="${#lists.isEmpty(danhSachMonAn)}">
            <div class="alert alert-warning mb-0">
              Hiện chưa có món ăn nào để hiển thị.
            </div>
          </div>

          <!-- ================= PAGINATION ================= -->

          <nav class="menu-pagination">
            <button class="page-btn">
              <i class="fa-solid fa-chevron-left"></i>
              Trang trước
            </button>

            <button class="page-number active">1</button>

            <button class="page-number">2</button>

            <button class="page-number">3</button>

            <span>...</span>

            <button class="page-number">12</button>

            <button class="page-btn">
              Trang sau

              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </nav>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/thucdon.js}"></script>
  </body>
</html>

spring.application.name=ViNha
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ViNha;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# S?A DÒNG NÀY: Thay 'validate' b?ng 'update'
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

server.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.messages.encoding=UTF-8
# Kích th??c t?i ?a c?a 1 file (ví d? 5MB)
spring.servlet.multipart.max-file-size=5MB
# Kích th??c t?i ?a c?a toàn b? request
spring.servlet.multipart.max-request-size=5MB
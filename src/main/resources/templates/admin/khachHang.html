<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý khách hàng - Vị Nhà Admin</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Nhúng file CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/khach-hang.css}">
</head>
<body>

<div class="admin-wrapper">

    <!-- GỌI FRAGMENT MENU DÙNG CHUNG VÀ LÀM SÁNG NÚT "KHÁCH HÀNG" -->
    <div th:replace="~{admin/sidebar :: sidebar('khachHang')}"></div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="admin-main">
        <!-- Tiêu đề -->
        <div class="header">
            <div class="title">
                <h1 class="page-title">Quản lý khách hàng</h1>
                <p class="page-subtitle">Xem và quản lý thông tin khách hàng trên hệ thống Vị Nhà.</p>
            </div>
            <button class="btn btn-add"><i class="fas fa-plus"></i> Thêm khách hàng mới</button>
        </div>

        <!-- Khu vực lọc & tìm kiếm -->
        <div class="filter-section box-panel">
            <form action="" method="get" class="filter-form">
                <div class="filter-row">
                    <!-- Tìm kiếm -->
                    <div class="filter-group" style="flex: 2;">
                        <label>Tìm kiếm khách hàng</label>
                        <div class="input-group">
                            <i class="fas fa-search"></i>
                            <input type="text" name="keyword" placeholder="Nhập tên, email hoặc số điện thoại...">
                        </div>
                    </div>

                    <!-- Lọc theo trạng thái -->
                    <div class="filter-group" style="flex: 1;">
                        <label>Trạng thái</label>
                        <select name="status" class="form-control">
                            <option value="">Tất cả trạng thái</option>
                            <option value="OPEN">Đang mở</option>
                            <option value="CLOSED">Đã đóng</option>
                        </select>
                    </div>

                    <!-- Nút hành động -->
                    <div class="filter-actions align-items-end">
                        <button type="submit" class="btn btn-search"><i class="fas fa-filter"></i> Lọc dữ liệu</button>
                        <a th:href="@{/admin/khachHang}" class="btn btn-reset"><i class="fas fa-sync-alt"></i></a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="table-container box-panel">
            <table>
                <thead>
                <tr>
                    <th width="50">STT</th>
                    <th>HỌ TÊN</th>
                    <th>LIÊN HỆ</th>
                    <th width="140">TRẠNG THÁI</th>
                    <th width="140">NGÀY TẠO</th>
                    <th width="140" style="text-align: center;">THAO TÁC</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="kh, iterStat : ${khachHangList}">
                    <td th:text="${iterStat.index + 1}">01</td>
                    <td>
                        <div class="font-weight-600 text-main" th:text="${kh.hoTen}">Nguyễn Văn Hoàng</div>
                    </td>
                    <td>
                        <div class="contact-info">
                            <span class="font-weight-600" th:text="${kh.email}">hoang.nv@gmail.com</span><br>
                            <span class="text-muted" style="font-size: 13px;" th:text="${kh.soDienThoai}">0987 654 321</span>
                        </div>
                    </td>
                    <td>
                        <span th:classappend="${kh.trangThai == 'ACTIVE' ? 'badge badge-open' : 'badge badge-closed'}" th:text="${kh.trangThai == 'ACTIVE' ? 'Đang mở' : 'Đã khóa'}">Đang mở</span>
                    </td>
                    <td>15/10/2026</td>
                    <td class="actions" style="text-align: center;">
                        <a th:href="@{/admin/khachHang/toggle(id=${kh.id})}" th:title="${kh.trangThai == 'ACTIVE' ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}" th:classappend="${kh.trangThai == 'ACTIVE' ? 'text-danger' : 'text-success'}" onclick="return confirm('Bạn có chắc muốn thực hiện thao tác này?');">
                            <i th:classappend="${kh.trangThai == 'ACTIVE' ? 'fas fa-lock' : 'fas fa-lock-open'}"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(khachHangList)}">
                    <td colspan="6" style="text-align: center; color: #64748b;">Không tìm thấy khách hàng nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="/js/admin/khach-hang.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý khách hàng - Vị Nhà Admin</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Admin dùng chung & đồng bộ -->
    <link rel="stylesheet" th:href="@{/css/admin/khach-hang.css}">
</head>
<body>

<div class="admin-wrapper">

    <!-- Nhúng Sidebar Fragment đồng bộ -->
    <div th:replace="~{admin/sidebar :: sidebar('khachHang')}"></div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="admin-main">

        <!-- Page Header -->
        <div class="page-header">
            <div class="title-group">
                <div class="header-brand-title">
                    <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Vị Nhà Logo" class="header-logo">
                    <h1 class="page-title">Quản lý khách hàng</h1>
                </div>
                <p class="page-subtitle">Xem và quản lý danh sách tài khoản khách hàng trên hệ thống Vị Nhà.</p>
            </div>
        </div>

        <!-- Notification Alerts -->
        <div th:if="${message}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <!-- Bộ Lọc Dữ Liệu Card -->
        <div class="filter-card">
            <div class="filter-form">
                <div class="form-group search-group">
                    <label class="filter-label">TÌM KIẾM KHÁCH HÀNG</label>
                    <div class="search-input-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="searchInput" class="form-control" placeholder="Nhập tên, email hoặc số điện thoại...">
                    </div>
                </div>

                <div class="form-group">
                    <label class="filter-label">TRẠNG THÁI</label>
                    <select id="statusFilter" class="form-control">
                        <option value="">Tất cả trạng thái</option>
                        <option value="Hoạt Động">Hoạt Động</option>
                        <option value="Khóa">Đã khóa</option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button type="button" id="searchBtn" class="btn-search">
                        <i class="fa-solid fa-filter"></i> Lọc
                    </button>
                    <button type="button" id="resetBtn" class="btn-refresh" title="Làm mới">
                        <i class="fas fa-rotate-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Bảng Dữ Liệu Card -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th class="text-center" width="60">STT</th>
                        <th width="200">HỌ TÊN</th>
                        <th>THÔNG TIN LIÊN HỆ</th>
                        <th class="text-center" width="130">NGÀY TẠO</th>
                        <th class="text-center" width="130">TRẠNG THÁI</th>
                        <th class="text-center" width="100">THAO TÁC</th>
                    </tr>
                    </thead>
                    <tbody id="customerTableBody">
                    <tr th:each="kh, iterStat : ${khachHangList}" class="customer-row">
                        <td class="col-stt text-center" th:text="${iterStat.index + 1}">1</td>
                        <td>
                            <strong class="food-title customer-name" th:text="${kh.hoTen}">Nguyễn Văn Hoàng</strong>
                        </td>
                        <td>
                            <div class="contact-info">
                                <span class="font-bold customer-email" th:text="${kh.email}">hoang.nv@gmail.com</span>
                                <span class="text-muted customer-phone" style="font-size: 12px;" th:text="${kh.soDienThoai}">0987 654 321</span>
                            </div>
                        </td>
                        <td class="text-center">
                            <span class="font-bold" th:text="${#temporals.format(kh.ngayTao, 'dd/MM/yyyy')}">15/10/2026</span>
                        </td>
                        <td class="text-center">
                            <span class="badge-status customer-status"
                                  th:classappend="${kh.trangThai == 'Hoạt Động' ? 'badge-success' : 'badge-danger'}"
                                  th:text="${kh.trangThai}">Hoạt Động</span>
                        </td>
                        <td class="text-center">
                            <div class="action-buttons">
                                <a th:href="@{/admin/khachHang/toggle(id=${kh.id})}"
                                   class="icon-btn"
                                   th:classappend="${kh.trangThai == 'Hoạt Động' ? 'btn-lock' : 'btn-unlock'}"
                                   th:title="${kh.trangThai == 'Hoạt Động' ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}"
                                   onclick="return confirm('Bạn có chắc muốn thực hiện thao tác này?');">
                                    <i th:classappend="${kh.trangThai == 'Hoạt Động' ? 'fa-solid fa-lock' : 'fa-solid fa-lock-open'}"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr id="noDataRow" th:if="${#lists.isEmpty(khachHangList)}" style="display: none;">
                        <td colspan="6" class="empty-table">Không tìm thấy khách hàng nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="/js/admin/khach-hang.js"></script>
</body>
</html>

<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quên mật khẩu - Vị Nhà</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- Google Font -->
    <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/quenmatkhau.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
</head>

<body>
<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- MAIN -->
<main>
    <div class="forgot-box">
        <div class="top-line"></div>

        <h1>Quên mật khẩu</h1>

        <!-- Hiển thị thông báo lỗi/thành công -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- FORM 1: LẤY MÃ OTP -->
        <div th:if="${session.SHOW_RESET_FORM == null}">
            <p>Nhập email hoặc số điện thoại đã đăng ký để lấy lại tài khoản.</p>
            <form th:action="@{/quenMatKhau/guiMa}" method="post">
                <label>Email hoặc Số điện thoại</label>
                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="text" name="taiKhoan" placeholder="Nhập email / số điện thoại" required />
                </div>
                <button type="submit" class="forgot-btn">Nhận mã xác nhận (OTP)</button>
            </form>
        </div>

        <!-- FORM 2: ĐẶT LẠI MẬT KHẨU -->
        <div th:if="${session.SHOW_RESET_FORM != null}">
            <p>Nhập mã xác nhận (OTP) được gửi tới bạn để đặt lại mật khẩu mới.</p>
            <form th:action="@{/quenMatKhau/datLai}" method="post">
                <label>Mã xác nhận (OTP)</label>
                <div class="input-group">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" name="otp" placeholder="Nhập mã OTP (6 số)" required maxlength="6" />
                </div>

                <label>Mật khẩu mới</label>
                <div class="input-group">
                    <input type="password" name="matKhauMoi" id="newPassword" placeholder="Nhập mật khẩu mới" required />
                    <i class="fa-regular fa-eye eye" id="toggleNew"></i>
                </div>

                <label>Xác nhận mật khẩu mới</label>
                <div class="input-group">
                    <input type="password" name="xacNhanMatKhau" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" required />
                    <i class="fa-regular fa-eye eye" id="toggleConfirm"></i>
                </div>

                <button type="submit" class="forgot-btn">Đổi mật khẩu</button>
            </form>
        </div>

        <div class="back-login">
            <a th:href="@{/dangNhap}"> &larr; Quay lại Đăng nhập </a>
        </div>
    </div>
</main>

<div class="divider">
    <i class="fa-solid fa-utensils"></i>
</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Logic for toggling password visibility
    const toggleNew = document.getElementById('toggleNew');
    const toggleConfirm = document.getElementById('toggleConfirm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');

    if(toggleNew && newPassword) {
        toggleNew.addEventListener('click', function () {
            const type = newPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            newPassword.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    }

    if(toggleConfirm && confirmPassword) {
        toggleConfirm.addEventListener('click', function () {
            const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPassword.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    }
</script>
</body>
</html>

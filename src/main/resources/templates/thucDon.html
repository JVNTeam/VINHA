<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thực đơn - Vị Nhà</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/thucDon.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
</head>
<body>
<!-- ================= HEADER ================= -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="menu-page">
  <!-- KHỐI HERO TIÊU ĐỀ BẮT ĐẦU TỪ MÉP TRÊN MÀN HÌNH -->
  <section class="menu-hero">
    <div class="container">
      <div class="page-title">
        <h1>Danh sách món ngon</h1>
        <p>
          Khám phá hương vị quê nhà qua từng món cơm được chuẩn bị tỉ mỉ từ
          những nguyên liệu tươi ngon nhất trong ngày.
        </p>
      </div>
    </div>
  </section>

  <div class="container main-content">

    <!-- ================= FILTER BOX ================= -->
    <div class="filter-box">
      <form method="get" th:action="@{/thucDon}" class="row g-3">

        <!-- Hàng 1: Search + Danh mục -->
        <div class="col-lg-4 col-md-12">
          <label for="keyword" class="form-label">TÊN MÓN</label>
          <div class="search-food">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                    id="keyword"
                    name="keyword"
                    type="text"
                    th:value="${keyword}"
                    placeholder="Tìm kiếm món ăn..."
            />
          </div>
        </div>

        <div class="col-lg-8 col-md-12">
          <label for="danhMucId" class="form-label">DANH MỤC</label>
          <select id="danhMucId" name="danhMucId" class="form-select">
            <option value="">Tất cả danh mục</option>
            <option
                    th:each="dm : ${danhSachDanhMuc}"
                    th:value="${dm.id}"
                    th:selected="${danhMucId != null and danhMucId == dm.id}"
                    th:text="${dm.ten}"
            >
              Danh mục
            </option>
          </select>
        </div>

        <!-- Hàng 2: Giá & Sắp xếp -->
        <div class="col-lg-3 col-md-6">
          <label for="giaTu" class="form-label">GIÁ TỪ</label>
          <input
                  id="giaTu"
                  name="giaTu"
                  type="number"
                  min="0"
                  step="1000"
                  class="form-control"
                  th:value="${giaTu}"
                  placeholder="VD: 30000"
          />
        </div>

        <div class="col-lg-3 col-md-6">
          <label for="giaDen" class="form-label">GIÁ ĐẾN</label>
          <input
                  id="giaDen"
                  name="giaDen"
                  type="number"
                  min="0"
                  step="1000"
                  class="form-control"
                  th:value="${giaDen}"
                  placeholder="VD: 80000"
          />
        </div>

        <div class="col-lg-3 col-md-6">
          <label for="sapXepBan" class="form-label">SỐ LƯỢNG BÁN</label>
          <select id="sapXepBan" name="sapXepBan" class="form-select">
            <option value="">Mặc định</option>
            <option value="BAN_NHIEU_NHAT" th:selected="${sapXepBan == 'BAN_NHIEU_NHAT'}">
              Bán nhiều nhất
            </option>
            <option value="BAN_IT_NHAT" th:selected="${sapXepBan == 'BAN_IT_NHAT'}">
              Bán ít nhất
            </option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="col-lg-3 col-md-6 d-flex align-items-end justify-content-end gap-2">
          <button type="submit" class="btn btn-warning text-white w-100">
            Lọc
          </button>
          <a th:href="@{/thucDon}" class="btn btn-outline-secondary w-100">
            Xóa lọc
          </a>
        </div>

      </form>
    </div>

    <!-- ================= PRODUCT GRID ================= -->
    <div class="row g-4 mt-1">
      <div class="col-lg-3 col-md-6" th:each="item : ${menuItemsWithRatings}" th:if="${item.mon.trangThai != 'Ngừng bán'}">
        <div class="food-card" th:onclick="'window.location.href=\'/chiTietMonAn?id=' + ${item.mon.id} + '\''" style="cursor: pointer;">

          <img
                  th:src="@{${(item.mon.hinhAnhs != null and !#lists.isEmpty(item.mon.hinhAnhs) and item.mon.hinhAnhs[0].duongDan != null and item.mon.hinhAnhs[0].duongDan != '') ? ( #strings.startsWith(item.mon.hinhAnhs[0].duongDan, '/') ? item.mon.hinhAnhs[0].duongDan : '/' + item.mon.hinhAnhs[0].duongDan ) : '/images/comGa.png'}}"
                  th:alt="${item.mon.ten}"
                  onerror="this.src='/images/comGa.png'"
          />

          <div class="food-content">
            <div class="food-rating mb-2" style="color: #ffc107; font-size: 0.9em;">
              <i class="fa-solid fa-star"></i>
              <span th:text="${item.avgRating != null ? #numbers.formatDecimal(item.avgRating, 1, 1) : '0.0'}" style="color: #1f2937; font-weight: 600;">0.0</span>
              <span class="text-muted ms-1" th:text="'(' + ${item.reviewCount} + ' đánh giá)'"></span>
            </div>
            <h3 th:text="${item.mon.ten}">Tên món</h3>

            <p th:text="${item.mon.moTa != null ? item.mon.moTa : 'Đang cập nhật mô tả...'}">
              Mô tả món ăn
            </p>

            <div class="food-bottom">
                  <span class="price" th:text="${#numbers.formatDecimal(item.mon.gia != null ? item.mon.gia : 0, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                    0đ
                  </span>
              <span class="sold">
                    Đã bán <span th:text="${item.mon.daBan != null ? item.mon.daBan : 0}">0</span>
                  </span>
            </div>

            <div class="food-btn">
              <form class="add-to-cart-form" th:action="@{/gioHang/them}" method="post" onclick="event.stopPropagation();">
                <input type="hidden" name="monAnId" th:value="${item.mon.id}" />
                <input type="hidden" name="soLuong" value="1" />
                <input type="hidden" name="redirectTo" value="/thucDon" />
                <button type="submit">
                  <i class="fa-solid fa-cart-plus"></i> Thêm
                </button>
              </form>

              <form class="buy-now-form" th:action="@{/gioHang/them}" method="post" onclick="event.stopPropagation();">
                <input type="hidden" name="monAnId" th:value="${item.mon.id}" />
                <input type="hidden" name="soLuong" value="1" />
                <input type="hidden" name="redirectTo" value="/thanhToan" />
                <button type="submit" class="detail-btn">
                  Mua
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Không tìm thấy món -->
      <div class="col-12" th:if="${#lists.isEmpty(danhSachMonAn)}">
        <div class="alert alert-warning mb-0 text-center py-4">
          <i class="fa-solid fa-circle-exclamation mb-2 fs-3"></i><br>
          Hiện chưa có món ăn nào phù hợp với yêu cầu tìm kiếm của bạn.
        </div>
      </div>
      <!-- ================= PAGINATION ================= -->
<!--      <nav class="menu-pagination">-->
<!--        <button class="page-btn">-->
<!--          <i class="fa-solid fa-chevron-left"></i> Trang trước-->
<!--        </button>-->
<!--        <button class="page-number active">1</button>-->
<!--        <button class="page-number">2</button>-->
<!--        <button class="page-number">3</button>-->
<!--        <span>...</span>-->
<!--        <button class="page-number">12</button>-->
<!--        <button class="page-btn">-->
<!--          Trang sau <i class="fa-solid fa-chevron-right"></i>-->
<!--        </button>-->
<!--      </nav>-->
<!--      -->
    </div>
  </div>
</main>

<!-- ================= FOOTER ================= -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/thucdon.js}"></script>
</body>
</html>

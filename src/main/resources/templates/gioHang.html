<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ hàng | Vị Nhà</title>

  <!-- Bootstrap 5 CSS (Bắt buộc cho Header & Footer) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Custom CSS Files (Sử dụng th:href) -->
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/gioHang.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
</head>

<body>
<!-- ================= HEADER FRAGMENT ================= -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- ================= MAIN CONTAINER ================= -->
<main class="gio-hang-page">

  <!-- BREADCRUMB -->
  <section class="breadcrumb-section">
    <div class="container">
      <a th:href="@{/trangChu}">Trang chủ</a>
      <span class="mx-2">></span>
      <strong>Giỏ hàng của bạn</strong>
    </div>
  </section>

  <!-- CART SECTION -->
  <section class="cart-section">
    <div class="container cart-layout">
      <!-- LEFT: Danh sách món ăn -->
      <div class="cart-left">
        <h1>Giỏ hàng của bạn</h1>

        <!-- Item -->
        <div class="cart-item" th:each="item : ${cartItems}">
          <div class="item-image">
            <img
                    th:src="@{${(item.monAn != null and item.monAn.hinhAnhs != null and !#lists.isEmpty(item.monAn.hinhAnhs) and item.monAn.hinhAnhs[0].duongDan != null and item.monAn.hinhAnhs[0].duongDan != '') ? ( #strings.startsWith(item.monAn.hinhAnhs[0].duongDan, '/') ? item.monAn.hinhAnhs[0].duongDan : '/' + item.monAn.hinhAnhs[0].duongDan ) : '/images/comGa.png'}}"
                    th:alt="${item.monAn != null ? item.monAn.ten : 'Món ăn'}"
                    onerror="this.src='/images/comGa.png'"
            />
          </div>

          <div class="item-info">
            <h3 th:text="${item.monAn != null ? item.monAn.ten : 'Món ăn'}">Tên món</h3>
            <p th:text="${item.monAn != null && item.monAn.moTa != null ? item.monAn.moTa : 'Đang cập nhật mô tả'}">Mô tả</p>
          </div>

          <div class="price" th:text="${#numbers.formatDecimal(item.donGia != null ? item.donGia : 0, 0, 'COMMA', 0, 'POINT') + 'đ'}">0đ</div>

          <div class="quantity">
            <form th:action="@{/gioHang/capNhatSoLuong}" method="post" style="display: inline">
              <input type="hidden" name="chiTietGioHangId" th:value="${item.id}" />
              <input type="hidden" name="soLuong" th:value="${item.soLuong > 1 ? item.soLuong - 1 : 1}" />
              <button class="minus" type="submit">-</button>
            </form>

            <input type="text" th:value="${item.soLuong}" readonly />

            <form th:action="@{/gioHang/capNhatSoLuong}" method="post" style="display: inline">
              <input type="hidden" name="chiTietGioHangId" th:value="${item.id}" />
              <input type="hidden" name="soLuong" th:value="${item.soLuong + 1}" />
              <button class="plus" type="submit">+</button>
            </form>
          </div>

          <div class="total" th:text="${#numbers.formatDecimal(item.thanhTien != null ? item.thanhTien : 0, 0, 'COMMA', 0, 'POINT') + 'đ'}">0đ</div>

          <div class="delete">
            <form th:action="@{/gioHang/xoa}" method="post">
              <input type="hidden" name="chiTietGioHangId" th:value="${item.id}" />
              <button type="submit" class="delete-btn" onclick="return confirm('Bạn có muốn xóa món này khỏi giỏ hàng không?');">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </form>
          </div>
        </div>

        <div th:if="${cartItems == null || #lists.isEmpty(cartItems)}" class="empty-cart-msg">
          <p>Giỏ hàng của bạn đang trống.</p>
        </div>

        <a th:href="@{/thucDon}" class="continue">
          <i class="fa-solid fa-arrow-left"></i>
          Tiếp tục mua hàng
        </a>
      </div>

      <!-- RIGHT: Tóm tắt đơn hàng -->
      <div class="cart-right">
        <div class="summary">
          <h2>Tóm tắt đơn hàng</h2>

          <div class="summary-row">
            <span>Tạm tính</span>
            <span id="subtotal" th:text="${#numbers.formatDecimal(subtotal != null ? subtotal : 0, 0, 'COMMA', 0, 'POINT') + 'đ'}">0đ</span>
          </div>

          <div class="summary-row">
            <span>Số lượng món</span>
            <span id="item-count" th:text="${itemCount != null ? itemCount : 0}">0</span>
          </div>

          <hr />

          <div class="summary-row total-row">
            <strong>Tổng cộng</strong>
            <strong id="grand-total" th:text="${#numbers.formatDecimal(subtotal != null ? subtotal : 0, 0, 'COMMA', 0, 'POINT') + 'đ'}">0đ</strong>
          </div>

          <a th:href="@{/thanhToan}" id="checkoutLink" onclick="return !document.getElementById('checkoutBtn').disabled">
            <button type="button" class="checkout-btn" id="checkoutBtn" th:disabled="${itemCount == null or itemCount == 0}">
              Thanh toán
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </a>

          <div class="safe-payment">
            <i class="fa-solid fa-shield-halved"></i>
            Thanh toán an toàn 100%
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ================= FOOTER FRAGMENT ================= -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/giohang.js}"></script>
</body>
</html>

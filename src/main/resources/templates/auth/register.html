<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Vị Nhà</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Dùng Chung & CSS Đăng ký -->
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/dangKy.css}">
</head>
<body class="register-page-body">

<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Register Content -->
<main class="register-main-wrapper">
    <div class="register-card-box">
        <h2 class="register-title">ĐĂNG KÝ TÀI KHOẢN</h2>

        <!-- Thông báo lỗi Validate Server -->
          <div th:if="${error}" class="alert alert-danger" style="color: red; margin-bottom: 15px;">
              <i class="fa-solid fa-circle-exclamation me-2"></i>
              <span th:text="${error}"></span>
          </div>

          <!-- Thông báo lỗi Validate Client (JS) -->
          <div id="clientError" class="alert alert-danger" style="display: none; color: red; margin-bottom: 15px;"></div>

        <form th:action="@{/dangKy}" method="post" id="registerForm">
            <!-- Ô Họ và tên (Không dùng toggle password) -->
            <div class="register-field-group">
                <label for="hoTen">Họ và tên</label>
                <div class="register-input-wrap">
                    <i class="fa-regular fa-user register-input-icon"></i>
                    <input type="text" id="hoTen" name="hoTen" placeholder="Nhập họ và tên" th:value="${hoTen}">
                </div>
            </div>

            <!-- Ô Email hoặc Số điện thoại -->
            <div class="register-field-group">
                <label for="contactInput">Email hoặc Số điện thoại</label>
                <div class="register-input-wrap">
                    <i class="fa-regular fa-envelope register-input-icon"></i>
                    <input type="text" id="contactInput" name="contact" placeholder="Nhập Email hoặc Số điện thoại" th:value="${contact}">
                </div>
            </div>

            <!-- Ô Mật khẩu -->
            <div class="register-field-group">
                <label for="password">Mật khẩu</label>
                <div class="register-input-wrap">
                    <input type="password" id="password" name="matKhau" placeholder="Nhập mật khẩu">
                    <i id="togglePassword" class="fa-solid fa-eye-slash"></i>
                </div>
            </div>

            <!-- Ô Xác nhận mật khẩu -->
            <div class="register-field-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <div class="register-input-wrap">
                    <input type="password" id="confirmPassword" name="xacNhanMatKhau" placeholder="Nhập lại mật khẩu">
                    <i id="toggleConfirmPassword" class="fa-solid fa-eye-slash"></i>
                </div>
            </div>

            <!-- Giới tính -->
            <div class="register-field-group">
                <label>Giới tính</label>
                <div class="register-gender-wrap">
                    <label class="register-gender-option">
                        <input type="radio" name="gioiTinh" value="1" th:checked="${gioiTinh == null || gioiTinh == 1}">
                        <span>Nam</span>
                    </label>
                    <label class="register-gender-option">
                        <input type="radio" name="gioiTinh" value="0" th:checked="${gioiTinh == 0}">
                        <span>Nữ</span>
                    </label>
                </div>
            </div>

            <!-- Nút đăng ký -->
            <button type="submit" class="btn-register-submit">ĐĂNG KÝ</button>

            <!-- Chuyển hướng sang đăng nhập -->
            <div class="register-redirect-link">
                Đã có tài khoản? <a th:href="@{/dangNhap}">Đăng nhập ngay</a>
            </div>
        </form>
    </div>
</main>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS & JS Đăng ký -->
<script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/dangKy.js}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                if (alert.id !== 'clientError' && alert.style.display !== 'none') {
                    alert.style.transition = 'opacity 0.5s ease';
                    alert.style.opacity = '0';
                    setTimeout(function() {
                        alert.style.display = 'none';
                    }, 500);
                }
            });
        }, 4000); // 4 giây
    });
</script>

</body>
</html>

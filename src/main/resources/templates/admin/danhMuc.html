<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - Vị Nhà Admin</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- CSS Admin dùng chung & đồng bộ -->
    <link rel="stylesheet" th:href="@{/css/admin/danh-muc.css}">
</head>
<body>

<div class="admin-wrapper">
    <!-- Nhúng Sidebar Fragment đồng bộ -->
    <div th:replace="~{admin/sidebar :: sidebar('danhMuc')}"></div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="admin-main">

        <!-- Page Header -->
        <div class="page-header">
            <div class="title-group">
                <div class="header-brand-title">
                    <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Vị Nhà Logo" class="header-logo">
                    <h1 class="page-title">Quản lý danh mục</h1>
                </div>
                <p class="page-subtitle">Quản lý và phân loại các nhóm thực đơn phục vụ khách hàng của Vị Nhà.</p>
            </div>
            <a th:href="@{/admin/danhMuc/them}" class="btn-add-new">
                <i class="fa-solid fa-plus"></i> Thêm danh mục mới
            </a>
        </div>

        <!-- Notification Alerts -->
        <div th:if="${message}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${message}">Thao tác thành công.</span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span th:text="${error}">Có lỗi xảy ra.</span>
        </div>

        <!-- Bộ Lọc Dữ Liệu Card -->
        <div class="filter-card">
            <form th:action="@{/admin/danhMuc}" method="get" class="filter-form">
                <div class="form-group search-group">
                    <label class="filter-label">TÌM KIẾM DANH MỤC</label>
                    <div class="search-input-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" name="keyword" class="form-control" placeholder="Nhập tên danh mục..." th:value="${keyword}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="filter-label">TRẠNG THÁI</label>
                    <select id="statusFilter" name="status" class="form-control">
                        <option value="" th:selected="${selectedStatus == '' or selectedStatus == null}">Tất cả trạng thái</option>
                        <option th:each="st : ${statusOptions}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${st == selectedStatus}">
                        </option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button type="submit" class="btn-search">
                        <i class="fa-solid fa-filter"></i> Lọc
                    </button>
                    <a th:href="@{/admin/danhMuc}" class="btn-refresh" title="Làm mới">
                        <i class="fas fa-rotate-right"></i>
                    </a>
                </div>
            </form>
        </div>

        <!-- Bảng Dữ Liệu Card -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th class="text-center" width="60">STT</th>
                        <th class="text-center" width="100">HÌNH ÁNH</th>
                        <th width="200">TÊN DANH MỤC</th>
                        <th>MÔ TẢ</th>
                        <th class="text-center" width="130">TRẠNG THÁI</th>
                        <th class="text-center" width="100">THAO TÁC</th>
                    </tr>
                    </thead>
                    <tbody id="categoryTableBody">
                    <tr th:each="dm, idx : ${danhMucs}" th:attr="data-status=${dm.trangThai}">
                        <td class="col-stt text-center" th:text="${idx.index + 1}">1</td>
                        <td class="text-center">
                            <div class="category-preview-container">
                                <img th:if="${dm.anh != null and dm.anh.trim() != ''}"
                                     th:src="${dm.anh.startsWith('http') ? dm.anh : (dm.anh.startsWith('/') ? dm.anh : '/' + dm.anh)}"
                                     alt="Danh mục" class="category-preview-img"
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />

                                <img th:if="${(dm.anh == null or dm.anh.trim() == '') and !#lists.isEmpty(dm.monAns) and !#lists.isEmpty(dm.monAns[0].hinhAnhs)}"
                                     th:src="${dm.monAns[0].hinhAnhs[0].duongDan.startsWith('http') ? dm.monAns[0].hinhAnhs[0].duongDan : (dm.monAns[0].hinhAnhs[0].duongDan.startsWith('/') ? dm.monAns[0].hinhAnhs[0].duongDan : '/' + dm.monAns[0].hinhAnhs[0].duongDan)}"
                                     alt="Danh mục" class="category-preview-img"
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />

                                <div th:if="${(dm.anh == null or dm.anh.trim() == '') and (#lists.isEmpty(dm.monAns) or #lists.isEmpty(dm.monAns[0].hinhAnhs))}" class="category-preview-placeholder">
                                    Chưa có ảnh
                                </div>
                            </div>
                        </td>
                        <td><strong class="food-title" th:text="${dm.ten}">Tên danh mục</strong></td>
                        <td><span class="category-desc" th:text="${dm.moTa != null and dm.moTa.trim() != '' ? dm.moTa : '-'}">Mô tả danh mục</span></td>
                        <td class="text-center">
                            <span class="badge-status"
                                  th:classappend="${dm.trangThai == 'Mở' or dm.trangThai == 'Hoạt động' ? 'badge-success' : 'badge-danger'}"
                                  th:text="${dm.trangThai != null ? dm.trangThai : 'Khóa'}">
                                Đang mở
                            </span>
                        </td>
                        <td class="text-center">
                            <div class="action-buttons">
                                <a th:href="@{/admin/danhMuc/sua(id=${dm.id})}" class="icon-btn btn-edit" title="Chỉnh sửa"><i class="fa-regular fa-pen-to-square"></i></a>
                                <a th:href="@{/admin/danhMuc/xoa(id=${dm.id})}" class="icon-btn btn-delete" title="Xóa" onclick="return confirm('Bạn có chắc muốn xóa danh mục này?');"><i class="fa-regular fa-trash-can"></i></a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${danhMucs == null or #lists.isEmpty(danhMucs)}" class="no-results">
                        <td colspan="6" class="empty-table">Không tìm thấy danh mục nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/admin/danh-muc.js}"></script>

<!-- JS lọc client-side cho Dropdown Trạng Thái -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const statusFilter = document.getElementById('statusFilter');
        const tableRows = document.querySelectorAll('#categoryTableBody tr[data-status]');

        if (statusFilter && tableRows.length > 0) {
            statusFilter.addEventListener('change', function() {
                const selectedStatus = this.value.trim().toLowerCase();
                let visibleCount = 0;

                tableRows.forEach(row => {
                    const rowStatus = (row.getAttribute('data-status') || '').trim().toLowerCase();

                    if (selectedStatus === "" || rowStatus === selectedStatus) {
                        row.style.display = '';
                        visibleCount++;

                        const sttCell = row.querySelector('.col-stt');
                        if (sttCell) {
                            sttCell.textContent = visibleCount;
                        }
                    } else {
                        row.style.display = 'none';
                    }
                });

                let emptyRow = document.getElementById('empty-js-row');
                const tbody = document.getElementById('categoryTableBody');

                if (visibleCount === 0) {
                    if (!emptyRow) {
                        emptyRow = document.createElement('tr');
                        emptyRow.id = 'empty-js-row';
                        emptyRow.innerHTML = '<td colspan="6" class="empty-table">Không có danh mục nào phù hợp với trạng thái đã chọn.</td>';
                        tbody.appendChild(emptyRow);
                    } else {
                        emptyRow.style.display = '';
                    }
                } else if (emptyRow) {
                    emptyRow.style.display = 'none';
                }
            });
        }
    });
</script>

</body>
</html>

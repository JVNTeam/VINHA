<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ cá nhân - Vị Nhà</title>

  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- CSS Header & Footer -->
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />

  <!-- Custom CSS cho trang Hồ Sơ -->
  <link rel="stylesheet" th:href="@{/css/hoso.css}" />
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="hoso-page">
  <div class="container account-container">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="user-profile">
        <h3 class="user-name" th:text="${user != null ? user.hoTen : 'Khách hàng'}">Khách hàng</h3>
        <p class="user-email" th:text="${user != null ? user.email : ''}"></p>
      </div>

      <nav class="sidebar-nav">
        <a th:href="@{/hoso}" class="nav-item active">
          <i class="fa-regular fa-user"></i> Hồ sơ cá nhân
        </a>
        <a th:href="@{/diachi}" class="nav-item">
          <i class="fa-solid fa-location-dot"></i> Quản lý địa chỉ
        </a>
        <a th:href="@{/lichsudonhang}" class="nav-item">
          <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đơn hàng
        </a>
        <a th:href="@{/danhgia}" class="nav-item">
          <i class="fa-regular fa-star"></i> Đánh giá món ăn
        </a>
        <a th:href="@{/doimatkhau}" class="nav-item">
          <i class="fa-solid fa-lock"></i> Đổi mật khẩu
        </a>
        <div class="nav-divider"></div>
        <a th:href="@{/dangXuat}" class="nav-item text-danger">
          <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
        </a>
      </nav>
    </aside>

    <!-- ===== CONTENT ===== -->
    <section class="content-card">

      <!-- Thông báo -->
      <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <!-- Header Content -->
      <div class="content-header">
        <div>
          <h2 class="page-title">Hồ sơ cá nhân</h2>
          <p class="page-subtitle">Quản lý thông tin cá nhân của bạn</p>
        </div>
        <button class="edit-btn" id="btnEdit" onclick="toggleEditMode()">
          <i class="fa-solid fa-pen"></i> Chỉnh sửa
        </button>
      </div>

      <!-- ======= CHẾ ĐỘ XEM ======= -->
      <div id="viewMode">
        <div class="info-grid">
          <div class="info-item">
            <label>Họ và tên</label>
            <span th:text="${user != null ? user.hoTen : '---'}">---</span>
          </div>
          <div class="info-item">
            <label>Email</label>
            <span th:text="${user != null ? user.email : '---'}">---</span>
          </div>
          <div class="info-item">
            <label>Số điện thoại</label>
            <span th:text="${user != null && user.soDienThoai != null ? user.soDienThoai : '---'}">---</span>
          </div>
          <div class="info-item">
            <label>Ngày sinh</label>
            <span th:text="${user != null && user.ngaySinh != null ? #temporals.format(user.ngaySinh, 'dd/MM/yyyy') : '---'}">---</span>
          </div>
          <div class="info-item">
            <label>Giới tính</label>
            <span th:text="${user != null && user.gioiTinh != null ? (user.gioiTinh == 0 ? 'Nam' : 'Nữ') : '---'}">---</span>
          </div>
        </div>

        <!-- Thẻ thành viên -->
        <div class="member-card">
          <div class="member-icon">
            <i class="fa-solid fa-crown"></i>
          </div>
          <div class="member-text">
            <h3>Thành viên thân thiết</h3>
            <p>Hạng Đồng</p>
            <small>Tích lũy thêm để lên hạng Bạc.</small>
          </div>
        </div>
      </div>

      <!-- ======= CHẾ ĐỘ CHỈNH SỬA ======= -->
      <div id="editMode" style="display:none">
        <form th:action="@{/hoso/capnhat}" method="post" class="edit-form">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Họ và tên <span class="required">*</span></label>
              <input
                      type="text"
                      name="hoTen"
                      class="form-input"
                      th:value="${user != null ? user.hoTen : ''}"
                      placeholder="Nhập họ và tên"
                      required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                      type="email"
                      name="email"
                      class="form-input"
                      th:value="${user != null ? user.email : ''}"
              />
            </div>

            <div class="form-group">
              <label class="form-label">Số điện thoại <span class="required">*</span></label>
              <input
                      type="tel"
                      name="soDienThoai"
                      class="form-input"
                      th:value="${user != null ? user.soDienThoai : ''}"
                      placeholder="Nhập số điện thoại"
                      required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Ngày sinh</label>
              <input
                      type="date"
                      name="ngaySinh"
                      class="form-input"
                      th:value="${user != null ? user.ngaySinh : ''}"
              />
            </div>

            <div class="form-group">
              <label class="form-label">Giới tính</label>
              <select name="gioiTinh" class="form-input form-select">
                <option value="">-- Chọn giới tính --</option>
                <option value="0" th:selected="${user != null && user.gioiTinh != null && user.gioiTinh == 0}">Nam</option>
                <option value="1" th:selected="${user != null && user.gioiTinh != null && user.gioiTinh == 1}">Nữ</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-save">
              <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
            </button>
            <button type="button" class="btn-cancel-edit" onclick="toggleEditMode()">
              Hủy
            </button>
          </div>
        </form>
      </div>

    </section>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/hoso.js}"></script>
</body>
</html>

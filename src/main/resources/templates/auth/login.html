<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Vị Nhà</title>

  <!-- Bootstrap -->
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet"
  />

  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/dangnhap.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
</head>

<body class="login-page-body">
<!-- ================= HEADER FRAGMENT ================= -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- ================= LOGIN MAIN ================= -->
<main class="login-main-wrapper">
  <div class="login-card-box">
    <h1>Đăng nhập</h1>

    <p>
      Đăng nhập để đặt món, theo dõi đơn hàng và quản lý tài khoản của bạn.
    </p>

    <!-- Hiển thị lỗi từ Controller nếu có -->
    <div th:if="${error}" class="alert alert-danger" role="alert">
      <i class="fa-solid fa-circle-exclamation me-2"></i>
      <span th:text="${error}"></span>
    </div>

    <!-- Thông báo thành công từ trang Đăng ký chuyển sang -->
    <div th:if="${success}" class="alert alert-success" role="alert">
      <i class="fa-solid fa-circle-check me-2"></i>
      <span th:text="${success}"></span>
    </div>

    <form id="loginForm" th:action="@{/dangNhap}" method="post">
      <div class="login-field-group">
        <label for="username">Email hoặc Số điện thoại</label>
        <div class="login-input-wrap">
          <img th:src="@{/images/login/IconHinhNguoi.png}" alt="icon user" />
          <input
                  type="text"
                  id="username"
                  name="username"
                  placeholder="Nhập email hoặc số điện thoại"
                  required
          />
        </div>
        <small id="usernameError" class="login-error-text"></small>
      </div>

      <div class="login-field-group">
        <label for="password">Mật khẩu</label>
        <div class="login-input-wrap">
          <img th:src="@{/images/login/IconOkhoa.png}" alt="icon lock" />
          <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Nhập mật khẩu"
                  required
          />
          <!-- Icon FontAwesome mắt gạch tương tự trang đăng ký -->
          <i id="togglePassword" class="fa-solid fa-eye-slash login-eye-icon"></i>
        </div>
      </div>

      <div class="login-options-row">
        <label class="remember-me">
          <input type="checkbox" name="remember" />
          <span>Ghi nhớ đăng nhập</span>
        </label>

        <a th:href="@{/quenMatKhau}" class="forgot-link">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="login-submit-btn">Đăng nhập</button>
    </form>

    <div class="login-register-redirect">
      Chưa có tài khoản?
      <a th:href="@{/dangKy}">Đăng ký ngay</a>
    </div>
  </div>
</main>

<!-- ================= FOOTER FRAGMENT ================= -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/dangnhap.js}"></script>
</body>
</html>

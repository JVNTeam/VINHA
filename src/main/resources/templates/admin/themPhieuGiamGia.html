<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${formTitle}">Thêm mã giảm giá</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/admin/phieu-giam-gia.css}"/>
    <style>
        /* === BỔ SUNG CLASS NÀY ĐỂ CĂN GIỮA TOÀN BỘ KHỐI === */
        .center-wrapper {
            max-width: 860px;
            margin: 30px auto; /* margin tự động đẩy khối ra giữa màn hình */
            padding-bottom: 40px;
        }
        /* ================================================= */

        .form-card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            width: 100%;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 13px;
        }
        .form-control, .form-textarea, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text-main);
        }
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-hint {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 22px;
            border: none;
            border-radius: 14px;
            background-color: var(--admin-orange);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background-color: var(--admin-orange-hover);
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #4b5563;
            margin-bottom: 24px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-back:hover {
            color: var(--admin-orange);
        }
        .alert-box {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .alert-success {
            background: #ecfdf5;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/sidebar :: sidebar('giamGia')}"></div>

    <main class="admin-main">
        <!-- Khối center-wrapper bọc toàn bộ form lại -->
        <div class="center-wrapper">
            <a th:href="@{/admin/phieuGiamGia}" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
            </a>

            <div class="page-header" style="margin-bottom: 18px;">
                <div class="title-group">
                    <h1 class="page-title" th:text="${formTitle}">Thêm mã giảm giá mới</h1>
                    <p class="page-subtitle">Điền thông tin chương trình khuyến mãi bên dưới.</p>
                </div>
            </div>

            <div class="form-card">
                <div th:if="${error}" class="alert-box alert-error">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span th:text="${error}"></span>
                </div>

                <form th:action="@{${formAction}}" method="post">
                    <input type="hidden" name="id" th:value="${voucher.id}"/>

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Mã giảm giá *</label>
                            <input type="text" name="ma" class="form-control" placeholder="VD: VINHA20"
                                   th:value="${voucher.ma}" required maxlength="50"/>
                            <span class="form-hint">Mã viết hoa, không dấu cách. Khách sẽ nhập mã này khi thanh toán.</span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Loại giảm *</label>
                            <select name="loaiGiam" id="loaiGiam" class="form-select" required>
                                <option th:each="loai : ${loaiGiamOptions}"
                                        th:value="${loai}"
                                        th:text="${loai}"
                                        th:selected="${loai == voucher.loaiGiam}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Giá trị giảm *</label>
                            <input type="number" name="giaTriGiam" class="form-control" min="1" step="0.01"
                                   placeholder="VD: 20 hoặc 30000" th:value="${voucher.giaTriGiam}" required/>
                            <span class="form-hint" id="giaTriHint">Nhập phần trăm (1-100) hoặc số tiền giảm trực tiếp.</span>
                        </div>

                        <div class="form-group" id="giamToiDaGroup">
                            <label class="form-label">Giảm tối đa</label>
                            <input type="number" name="giamToiDa" class="form-control" min="0" step="1000"
                                   placeholder="VD: 50000" th:value="${voucher.giamToiDa}"/>
                            <span class="form-hint">Chỉ áp dụng khi giảm theo phần trăm.</span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Đơn tối thiểu</label>
                            <input type="number" name="donToiThieu" class="form-control" min="0" step="1000"
                                   placeholder="VD: 150000" th:value="${voucher.donToiThieu}"/>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Số lượng phát hành *</label>
                            <input type="number" name="soLuong" class="form-control" min="0" step="1"
                                   placeholder="VD: 200" th:value="${voucher.soLuong}" required/>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Giới hạn nhận / khách</label>
                            <input type="number" name="gioiHanNhan" class="form-control" min="1" step="1"
                                   placeholder="VD: 1" th:value="${voucher.gioiHanNhan != null ? voucher.gioiHanNhan : 1}"/>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Ngày bắt đầu</label>
                            <input type="datetime-local" name="ngayBatDau" class="form-control"
                                   th:value="${ngayBatDauInput}"/>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Ngày kết thúc</label>
                            <input type="datetime-local" name="ngayKetThuc" class="form-control"
                                   th:value="${ngayKetThucInput}"/>
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">Mô tả</label>
                            <textarea name="moTa" class="form-textarea"
                                      placeholder="Mô tả ngắn về chương trình khuyến mãi">[[${voucher.moTa}]]</textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-save"></i>
                        <span th:text="${formTitle}">Lưu</span>
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<script>
    const loaiGiamSelect = document.getElementById('loaiGiam');
    const giamToiDaGroup = document.getElementById('giamToiDaGroup');

    function updateLoaiGiamUI() {
        const isPercent = loaiGiamSelect.value === 'Phần trăm';
        giamToiDaGroup.style.display = isPercent ? 'block' : 'none';
    }

    loaiGiamSelect.addEventListener('change', updateLoaiGiamUI);
    document.addEventListener('DOMContentLoaded', updateLoaiGiamUI);
</script>
</body>
</html>

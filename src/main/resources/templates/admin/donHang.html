<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - Vị Nhà Admin</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/don-hang.css}">
</head>
<body>

<div class="admin-wrapper">
    <div th:replace="~{admin/sidebar :: sidebar('donHang')}"></div>

    <!-- MAIN CONTENT -->
    <main class="admin-main">

        <div class="header">
            <h1>Quản lý đơn hàng</h1>
        </div>

        <!-- 4 THẺ THỐNG KÊ -->
        <div class="summary-cards">
            <div class="card">
                <div class="icon-box bg-orange-light"><i class="fas fa-clipboard-list text-orange"></i></div>
                <div class="card-info">
                    <h3 th:text="${choXacNhan != null ? choXacNhan : '24'}">24</h3>
                    <p class="text-gray">Chờ xác nhận</p>
                </div>
            </div>
            <div class="card">
                <div class="icon-box bg-blue-light"><i class="fas fa-check-circle text-blue"></i></div>
                <div class="card-info">
                    <h3 th:text="${daXacNhan != null ? daXacNhan : '15'}">15</h3>
                    <p class="text-gray">Xác nhận</p>
                </div>
            </div>
            <div class="card">
                <div class="icon-box bg-red-light" style="background-color: #fee2e2;"><i class="fas fa-times-circle text-red" style="color: #ef4444;"></i></div>
                <div class="card-info">
                    <h3 th:text="${daHuy != null ? daHuy : '0'}">0</h3>
                    <p class="text-gray">Đơn hủy</p>
                </div>
            </div>
            <div class="card bg-orange text-white border-0">
                <div class="icon-box bg-white-opacity"><i class="fas fa-check-circle text-white"></i></div>
                <div class="card-info">
                    <h3 class="text-white" th:text="${doanhThu != null ? #numbers.formatDecimal(doanhThu, 0, 'COMMA', 0, 'POINT') + 'đ' : '12.450k'}">12.450k</h3>
                    <p class="text-white">Doanh thu hoàn thành</p>
                </div>
            </div>
        </div>

        <!-- KHU VỰC LỌC -->
        <!-- KHU VỰC LỌC -->
        <div class="filter-section" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
            <div class="search-box" style="flex: 1; min-width: 250px; position: relative;">
                <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="text" id="keywordInput" class="form-control" placeholder="Tìm theo mã đơn, tên, SĐT..." style="padding-left: 40px; width: 100%;">
            </div>
            
            <div class="filter-left" style="display: flex; gap: 10px;">
                <input type="date" id="dateFilter" class="form-control" style="cursor: pointer;" title="Lọc theo ngày đặt">
                <select id="statusSelect" class="form-control">
                    <option value="">Tất cả trạng thái</option>
                    <option value="Chờ xác nhận">Chờ xác nhận</option>
                    <option value="Xác nhận">Xác nhận</option>
                    <option value="Hoàn thành">Hoàn thành</option>
                    <option value="Hủy">Hủy</option>
                </select>
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU ĐƠN HÀNG -->
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th style="width: 13%;">MÃ ĐƠN HÀNG</th>
                    <th style="width: 20%;">KHÁCH HÀNG</th>
                    <th style="width: 12%;">NGÀY ĐẶT</th>
                    <th style="width: 12%;">TỔNG TIỀN</th>
                    <th style="width: 15%;">THANH TOÁN</th>
                    <th style="width: 20%;">TRẠNG THÁI</th>
                    <th style="text-align: center; width: 8%;">THAO TÁC</th>
                </tr>
                </thead>
                <tbody id="orderTableBody">
                <!-- Render động từ DB nếu có donHangs -->
                <tr th:each="dh : ${donHangs}"
                    th:if="${donHangs != null && !#lists.isEmpty(donHangs)}"
                    class="order-row"
                    th:data-status="${dh.trangThai}"
                    th:data-date="${dh.ngayTao != null ? #temporals.format(dh.ngayTao, 'yyyy-MM-dd') : ''}"
                    th:data-search="${'#VN-' + dh.id + ' vn-' + dh.id + ' ' + (dh.nguoiDung != null ? dh.nguoiDung.hoTen : (dh.diaChi != null ? dh.diaChi.tenNguoiNhan : '')) + ' ' + (dh.nguoiDung != null ? dh.nguoiDung.soDienThoai : (dh.diaChi != null ? dh.diaChi.sdtNguoiNhan : ''))}">
                    <td><span class="text-orange font-bold" th:text="'#VN-' + ${dh.id}">#VN-29034</span></td>
                    <td>
                        <div class="details">
                            <strong class="text-main" th:text="${dh.nguoiDung != null ? dh.nguoiDung.hoTen : (dh.diaChi != null && dh.diaChi.tenNguoiNhan != null ? dh.diaChi.tenNguoiNhan : 'Khách vãng lai')}">Nguyễn Thành Nam</strong>
                            <span class="text-gray text-sm" th:text="${dh.nguoiDung != null ? dh.nguoiDung.soDienThoai : (dh.diaChi != null ? dh.diaChi.sdtNguoiNhan : '')}">0908 123 456</span>
                        </div>
                    </td>
                    <td class="date-col">
                        <strong class="text-main" th:text="${dh.ngayTao != null ? #temporals.format(dh.ngayTao, 'HH:mm') : '--:--'}">10:24</strong><br>
                        <span class="text-gray text-sm" th:text="${dh.ngayTao != null ? #temporals.format(dh.ngayTao, 'dd/MM/yyyy') : '--/--/----'}">25/10/2026</span>
                    </td>
                    <td><strong class="text-main" th:text="${dh.tongTien != null ? #numbers.formatDecimal(dh.tongTien, 0, 'COMMA', 0, 'POINT') + 'đ' : '0đ'}">450.000đ</strong></td>
                    <td>
                        <span class="pay-badge">
                            <i class="fas fa-money-check-alt text-gray"></i>
                            <span th:text="${dh.hinhThucThanhToan != null ? dh.hinhThucThanhToan : 'Tiền mặt'}">Chuyển khoản</span>
                        </span>
                    </td>
                    <td>
                        <form th:action="@{/admin/donHang/updateStatus}" method="post" style="display: inline;">
                            <input type="hidden" name="id" th:value="${dh.id}">
                            <div class="status-stack">
                                <!-- Nút Hủy -->
                                <button type="submit" name="status" value="Hủy"
                                        class="status-btn btn-cancel"
                                        th:classappend="${dh.trangThai == 'Hủy' ? 'active' : ''}"
                                        th:disabled="${dh.trangThai == 'Hoàn thành' || dh.trangThai == 'Hủy' || dh.trangThai == 'Xác nhận'}">Hủy</button>

                                <!-- Nút Chờ xác nhận -->
                                <button type="submit" name="status" value="Chờ xác nhận"
                                        class="status-btn"
                                        th:classappend="${dh.trangThai == 'Chờ xác nhận' ? 'active' : (dh.trangThai != 'Hủy' ? 'completed' : '')}"
                                        th:disabled="${dh.trangThai != 'Xác nhận' && dh.trangThai != 'Hủy'}">Chờ xác nhận</button>

                                <!-- Nút Xác nhận -->
                                <button type="submit" name="status" value="Xác nhận"
                                        class="status-btn"
                                        th:classappend="${dh.trangThai == 'Xác nhận' ? 'active' : (dh.trangThai == 'Hoàn thành' ? 'completed' : '')}"
                                        th:disabled="${dh.trangThai != 'Chờ xác nhận'}">Xác nhận</button>

                                <!-- Nút Hoàn thành -->
                                <button type="submit" name="status" value="Hoàn thành"
                                        class="status-btn"
                                        th:classappend="${dh.trangThai == 'Hoàn thành' ? 'active' : ''}"
                                        th:disabled="${dh.trangThai != 'Xác nhận'}">Hoàn thành</button>
                            </div>
                        </form>
                    </td>
                    <td style="text-align: center;">
                        <a th:href="@{'/admin/chiTietDon/' + ${dh.id}}" class="btn-detail" style="text-decoration: none; display: inline-block;">Xem chi tiết</a>
                    </td>
                </tr>
                <tr id="noResultsRow" style="display: none;">
                    <td colspan="7" style="text-align: center; padding: 30px; color: #888;">
                        Không tìm thấy đơn hàng nào phù hợp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- PHÂN TRANG JS -->
        <div class="pagination-container" id="paginationContainer" style="display: flex; justify-content: center; margin-top: 20px; gap: 5px;">
            <!-- Buttons sẽ được JS tạo ra ở đây -->
        </div>

    </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const keywordInput = document.getElementById('keywordInput');
    const dateFilter = document.getElementById('dateFilter');
    const statusSelect = document.getElementById('statusSelect');
    const allRows = Array.from(document.querySelectorAll('.order-row'));
    const noResultsRow = document.getElementById('noResultsRow');
    const paginationContainer = document.getElementById('paginationContainer');
    
    let filteredRows = [...allRows];
    let currentPage = 1;
    const itemsPerPage = 10;

    function applyFilter() {
        const keyword = keywordInput.value.trim().toLowerCase();
        const dateVal = dateFilter.value;
        const status = statusSelect.value;
        
        filteredRows = allRows.filter(row => {
            const rowSearch = row.getAttribute('data-search').toLowerCase();
            const rowStatus = row.getAttribute('data-status');
            const rowDate = row.getAttribute('data-date');
            
            const matchKeyword = keyword === '' || rowSearch.includes(keyword);
            const matchDate = dateVal === '' || rowDate === dateVal;
            const matchStatus = status === '' || rowStatus === status;
            
            return matchKeyword && matchDate && matchStatus;
        });
        
        currentPage = 1;
        renderTable();
    }

    function renderTable() {
        // Ẩn tất cả
        allRows.forEach(row => row.style.display = 'none');
        
        if (filteredRows.length === 0) {
            noResultsRow.style.display = 'table-row';
            paginationContainer.innerHTML = '';
            return;
        } else {
            noResultsRow.style.display = 'none';
        }
        
        const totalPages = Math.ceil(filteredRows.length / itemsPerPage);
        
        // Hiển thị row theo trang
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        
        for (let i = startIndex; i < endIndex && i < filteredRows.length; i++) {
            filteredRows[i].style.display = 'table-row';
        }
        
        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        if (totalPages <= 1) {
            paginationContainer.innerHTML = '';
            return;
        }
        
        let html = '';
        if (currentPage > 1) {
            html += `<a href="#" data-page="${currentPage - 1}" class="btn btn-outline" style="padding: 5px 10px;">&laquo; Trang trước</a>`;
        }
        
        for (let i = 1; i <= totalPages; i++) {
            const activeClass = i === currentPage ? 'btn-orange' : 'btn-outline';
            html += `<a href="#" data-page="${i}" class="btn ${activeClass}" style="padding: 5px 10px;">${i}</a>`;
        }
        
        if (currentPage < totalPages) {
            html += `<a href="#" data-page="${currentPage + 1}" class="btn btn-outline" style="padding: 5px 10px;">Trang sau &raquo;</a>`;
        }
        
        paginationContainer.innerHTML = html;
        
        // Gắn sự kiện click
        paginationContainer.querySelectorAll('a').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                currentPage = parseInt(this.getAttribute('data-page'));
                renderTable();
            });
        });
    }

    // Gán sự kiện
    keywordInput.addEventListener('input', applyFilter);
    dateFilter.addEventListener('change', applyFilter);
    statusSelect.addEventListener('change', applyFilter);

    // Khởi tạo ban đầu
    renderTable();
});
</script>

    </main>
</div>

</body>
</html>

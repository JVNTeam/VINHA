<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhân viên - Vị Nhà Admin</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Nhúng file CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/nhan-vien.css}">
</head>
<body>

<div class="admin-wrapper">

    <!-- GỌI FRAGMENT MENU VÀ LÀM SÁNG NÚT "NHÂN VIÊN" -->
    <div th:replace="~{admin/sidebar :: sidebar('nhanVien')}"></div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="admin-main">
        <!-- Tiêu đề -->
        <div class="page-header">
            <div class="title-group">
                <h1 class="page-title">Quản lý nhân viên</h1>
                <p class="page-subtitle">Xem và quản lý thông tin nhân viên trên hệ thống Vị Nhà.</p>
            </div>
            <a th:href="@{/admin/nhanVien/them}" class="btn-add" style="text-decoration: none;"><i class="fas fa-plus"></i> Thêm nhân viên mới</a>
        </div>

        <div class="filter-card">
            <div class="filter-form">
                <!-- TÌM KIẾM -->
                <div class="filter-group group-search">
                    <label class="filter-label">Tìm kiếm nhân viên</label>
                    <div class="search-input-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="searchInput" class="filter-input" placeholder="Nhập tên, email hoặc số điện thoại...">
                    </div>
                </div>

                <div class="filter-group group-select">
                    <label class="filter-label">Trạng thái</label>
                    <select id="statusFilter" class="filter-select">
                        <option value="">Tất cả trạng thái</option>
                        <option value="Hoạt Động">Hoạt động</option>
                        <option value="Khóa">Bị khóa</option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button type="button" id="searchBtn" class="btn-search"><i class="fas fa-filter"></i> Lọc</button>
                    <button type="button" id="resetBtn" class="btn-reset"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th style="width: 5%; text-align: center;">STT</th>
                        <th style="width: 35%;">HỌ TÊN</th>
                        <th style="width: 30%;">LIÊN HỆ</th>
                        <th style="width: 15%; text-align: center;">TRẠNG THÁI</th>
                        <th style="width: 15%; text-align: center;">THAO TÁC</th>
                    </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                    <tr th:each="nv, iterStat : ${nhanVienList}" class="employee-row">
                        <td class="col-stt" style="text-align: center;" th:text="${iterStat.index + 1}">01</td>
                        <td>
                            <div class="details-text">
                                <strong class="col-dish-name employee-name" th:text="${nv.hoTen}">Nguyễn Văn Hoàng</strong><br>
                                <span class="text-muted" style="font-size: 13px;" th:text="'Vai trò: ' + ${nv.vaiTro != null ? nv.vaiTro.ten : 'Chưa phân'}">Vai trò: Lễ tân</span>
                            </div>
                        </td>
                        <td>
                            <div class="contact-info">
                                <strong style="color: var(--text-main); font-weight: 600;" class="employee-email" th:text="${nv.email}">hoang.nv@gmail.com</strong><br>
                                <span class="text-muted employee-phone" style="font-size: 13px;" th:text="${nv.soDienThoai}">0987 654 321</span>
                            </div>
                        </td>
                        <td style="text-align: center;">
                            <span class="employee-status" th:classappend="${#strings.equalsIgnoreCase(nv.trangThai, 'Hoạt Động') ? 'badge badge-active' : 'badge badge-locked'}" th:text="${#strings.equalsIgnoreCase(nv.trangThai, 'Hoạt Động') ? 'Hoạt động' : 'Bị khóa'}">Hoạt động</span>
                        </td>
                        <td style="text-align: center;">
                            <div class="action-buttons">
                                <a th:href="@{/admin/nhanVien/sua(id=${nv.id})}" class="btn-icon text-blue" title="Chỉnh sửa"><i class="fas fa-edit"></i></a>
                                <a th:href="@{/admin/nhanVien/xoa(id=${nv.id})}" th:classappend="${nv.vaiTro.id == 3 ? 'disabled' : ''}" class="btn-icon text-danger" title="Khóa/Mở khóa" onclick="return confirm('Bạn có chắc muốn thực hiện thao tác này?');"><i th:classappend="${#strings.equalsIgnoreCase(nv.trangThai, 'Hoạt Động') ? 'fas fa-lock' : 'fas fa-lock-open'}"></i></a>
                            </div>
                        </td>
                    </tr>
                    <tr id="noDataRow" th:if="${#lists.isEmpty(nhanVienList)}" style="display: none;">
                        <td colspan="5" style="text-align: center; color: #64748b;">Không tìm thấy nhân viên nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="/js/admin/nhan-vien.js"></script>
</body>
</html>

<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch sử đơn hàng - Vị Nhà</title>

  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- CSS Header & Footer -->
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />

  <!-- Custom CSS cho trang Lịch Sử Đơn Hàng -->
  <link rel="stylesheet" th:href="@{/css/lichSuDonHang.css}" />
</head>

<body>
<!-- ================= HEADER (GỌI TỪ FRAGMENT) ================= -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- ================= MAIN CONTENT ================= -->
<main class="lichsudonhang-page">
  <div class="container account-container">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="user-profile">
        <h3 class="user-name" th:text="${user != null ? user['name'] : 'Khách hàng'}">Nguyễn Thu Hà</h3>
        <p class="user-email" th:text="${user != null ? user['email'] : ''}">thuha.nguyen@email.com</p>
      </div>

      <nav class="sidebar-nav">
        <a th:href="@{/hoso}" class="nav-item">
          <i class="fa-regular fa-user"></i> Hồ sơ cá nhân
        </a>
        <a th:href="@{/diachi}" class="nav-item">
          <i class="fa-solid fa-location-dot"></i> Quản lý địa chỉ
        </a>
        <a th:href="@{/lichsudonhang}" class="nav-item active">
          <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đơn hàng
        </a>
        <a th:href="@{/danhgia}" class="nav-item">
          <i class="fa-regular fa-star"></i> Đánh giá món ăn
        </a>
        <a th:href="@{/doimatkhau}" class="nav-item">
          <i class="fa-solid fa-lock"></i> Đổi mật khẩu
        </a>
        <div class="nav-divider"></div>
        <a th:href="@{/dangXuat}" class="nav-item text-danger">
          <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
        </a>
      </nav>
    </aside>

    <!-- ===== CONTENT CARD ===== -->
    <section class="content-card">
      <div class="content-header">
        <div>
          <h2 class="page-title">Lịch sử đơn hàng</h2>
          <p class="page-subtitle">Quản lý và theo dõi các đơn hàng của bạn</p>
        </div>
      </div>

      <!-- Tab Lọc -->
      <div class="order-tabs">
        <button class="tab-btn active" onclick="filterOrder('all', this)">Tất cả</button>
        <button class="tab-btn" onclick="filterOrder('pending', this)">Chờ xác nhận</button>
        <button class="tab-btn" onclick="filterOrder('completed', this)">Hoàn thành</button>
        <button class="tab-btn" onclick="filterOrder('cancelled', this)">Đã hủy</button>
      </div>

      <!-- Bảng Đơn Hàng -->
      <div class="table-responsive">
        <table class="order-table">
          <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th style="text-align: right">Thao tác</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="order : ${orders}" th:class="|order-row ${order.statusCode}|">
            <td class="order-id" th:text="${order.code}">#VN-2024-0812</td>
            <td th:text="${order.date}">12/08/2024</td>
            <td class="order-price" th:text="${order.price}">245.000đ</td>
            <td>
              <span th:class="|badge-status badge-${order.statusCode}|" th:text="${order.statusText}">Chờ xác nhận</span>
            </td>
            <td>
              <div class="action-group">
                <button class="btn-cancel-order" th:if="${order.statusCode == 'pending'}" th:data-code="${order.code}" onclick="cancelOrder(this.getAttribute('data-code'))">
                  Hủy đơn
                </button>
                <button class="btn-view-detail" th:data-code="${order.code}" onclick="viewDetail(this.getAttribute('data-code'))">
                  Xem chi tiết
                </button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- Phân trang -->
      <div class="pagination">
        <button class="page-item"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="page-item active">1</button>
        <button class="page-item">2</button>
        <button class="page-item">3</button>
        <button class="page-item"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </section>

  </div>
</main>

<!-- ================= FOOTER (GỌI TỪ FRAGMENT) ================= -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- JS Bootstrap & Custom -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/lichsudonhang.js}"></script>
</body>
</html>

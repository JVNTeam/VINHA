<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - Vị Nhà</title>

    <!-- Google Fonts & FontAwesome chuẩn theo dự án -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Nhúng CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/danh-muc.css}">
</head>
<body>

<div class="admin-wrapper">
    <div th:replace="~{admin/sidebar :: sidebar('danhMuc')}"></div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="admin-main">
        <!-- Tiêu đề -->
        <div class="page-header">
            <div class="title-group">
                <h1 class="page-title">Quản lý danh mục</h1>
                <p class="page-subtitle">Quản lý và phân loại các nhóm thực đơn phục vụ khách hàng.</p>
            </div>
            <a th:href="@{/admin/danhMuc/them}" class="btn-add">
                <i class="fa-solid fa-plus"></i> Thêm danh mục mới
            </a>
        </div>

        <div th:if="${message}" class="alert-box alert-success" style="margin: 0 24px 16px;">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${message}">Thao tác thành công.</span>
        </div>
        <div th:if="${error}" class="alert-box alert-error" style="margin: 0 24px 16px;">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span th:text="${error}">Có lỗi xảy ra.</span>
        </div>

        <!-- Filter Card -->
        <div class="filter-card">
            <form th:action="@{/admin/danhMuc}" method="get" class="filter-form" style="flex-wrap: wrap;">
                <div class="filter-group group-search" style="flex: 2;">
                    <label class="filter-label">Tên danh mục</label>
                    <div class="search-input-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" name="keyword" class="filter-input" placeholder="Nhập tên danh mục cần tìm..." th:value="${keyword}">
                    </div>
                </div>

                <div class="filter-group group-select" style="flex: 1;">
                    <label class="filter-label">Trạng thái</label>
                    <select id="statusFilter" name="status" class="filter-select">
                        <option value="" th:selected="${selectedStatus == ''}">Tất cả trạng thái</option>
                        <option th:each="st : ${statusOptions}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${st == selectedStatus}">
                        </option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button type="submit" class="btn-search">Tìm kiếm</button>
                    <!-- ĐÃ FIX: Đổi link thành /admin/danhMuc (bỏ dấu gạch ngang) -->
                    <a th:href="@{/admin/danhMuc}" class="btn-reset">Làm mới</a>
                </div>
            </form>
        </div>

        <!-- Data Table Card -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th width="70">STT</th>
                        <th width="120">HÌNH ẢNH</th>
                        <th width="200">TÊN DANH MỤC</th>
                        <th>MÔ TẢ</th>
                        <th width="140">TRẠNG THÁI</th>
                        <th width="120">SỐ MÓN ĂN</th>
                        <th width="120" style="text-align: center;">THAO TÁC</th>
                    </tr>
                    </thead>
                    <tbody id="categoryTableBody" th:if="${danhMucs != null and !#lists.isEmpty(danhMucs)}">
                    <tr th:each="dm, idx : ${danhMucs}" th:attr="data-status=${dm.trangThai}">
                        <td class="col-stt" th:text="${idx.index + 1 < 10 ? '0' + (idx.index + 1) : idx.index + 1}">01</td>
                        <td>
                            <img th:if="${dm.anh != null and dm.anh != ''}"
                                 th:src="${dm.anh.startsWith('http') ? dm.anh : (dm.anh.startsWith('/') ? dm.anh : '/' + dm.anh)}"
                                 alt="Danh mục" class="dish-preview-img"
                                 onerror="this.style.display='none'" />
                            <img th:if="${(dm.anh == null or dm.anh == '') and !#lists.isEmpty(dm.monAns) and !#lists.isEmpty(dm.monAns[0].hinhAnhs)}"
                                 th:src="${dm.monAns[0].hinhAnhs[0].duongDan.startsWith('http') ? dm.monAns[0].hinhAnhs[0].duongDan : (dm.monAns[0].hinhAnhs[0].duongDan.startsWith('/') ? dm.monAns[0].hinhAnhs[0].duongDan : '/' + dm.monAns[0].hinhAnhs[0].duongDan)}"
                                 alt="Danh mục" class="dish-preview-img"
                                 onerror="this.style.display='none'" />
                            <img th:if="${(dm.anh == null or dm.anh == '') and (#lists.isEmpty(dm.monAns) or #lists.isEmpty(dm.monAns[0].hinhAnhs))}"
                                 src="https://images.unsplash.com/photo-1528735607220-8f59e29c74f4?q=80&w=150&auto=format&fit=crop"
                                 alt="Danh mục" class="dish-preview-img" />
                        </td>
                        <td class="col-dish-name" th:text="${dm.ten}">Tên danh mục</td>
                        <td style="color: var(--text-muted);" th:text="${dm.moTa != null ? dm.moTa : '-'}">Mô tả</td>
                        <td>
                            <span th:text="${dm.trangThai}"
                                  th:classappend="${dm.trangThai == 'Mở'} ? ' badge-status-active' : ' badge-status-lock'">
                                Đang mở
                            </span>
                        </td>
                        <td>
                            <span class="path-code"
                                  th:text="${#lists.size(dm.monAns.?[trangThai != 'Ngừng bán'])} + ' món'">0 món</span>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <a th:href="@{/admin/danhMuc/sua(id=${dm.id})}" class="btn-icon" title="Sửa"><i class="fa-regular fa-pen-to-square"></i></a>
                                <a th:href="@{/admin/danhMuc/xoa(id=${dm.id})}" class="btn-icon text-danger btn-delete" title="Xóa"><i class="fa-regular fa-trash-can"></i></a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                    <tbody th:if="${danhMucs == null or #lists.isEmpty(danhMucs)}">
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 24px;">Không tìm thấy danh mục nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/admin/danh-muc.js}"></script>

<!-- JS THÊM VÀO ĐỂ LỌC TRẠNG THÁI -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const statusFilter = document.getElementById('statusFilter');
        const tableRows = document.querySelectorAll('#categoryTableBody tr[data-status]');

        if (statusFilter && tableRows.length > 0) {
            statusFilter.addEventListener('change', function() {
                const selectedStatus = this.value.trim();
                let visibleCount = 0;

                tableRows.forEach(row => {
                    const rowStatus = row.getAttribute('data-status').trim();

                    // Nếu chọn "Tất cả" hoặc khớp với trạng thái của dòng
                    if (selectedStatus === "" || rowStatus === selectedStatus) {
                        row.style.display = ''; // Hiện dòng
                        visibleCount++;

                        // Đánh lại số thứ tự (STT) cho đẹp
                        const sttCell = row.querySelector('.col-stt');
                        if (sttCell) {
                            sttCell.textContent = visibleCount < 10 ? '0' + visibleCount : visibleCount;
                        }
                    } else {
                        row.style.display = 'none'; // Ẩn dòng
                    }
                });

                // Xử lý thông báo nếu lọc không ra kết quả nào
                let emptyRow = document.getElementById('empty-js-row');
                const tbody = document.getElementById('categoryTableBody');

                if (visibleCount === 0) {
                    if (!emptyRow) {
                        emptyRow = document.createElement('tr');
                        emptyRow.id = 'empty-js-row';
                        emptyRow.innerHTML = '<td colspan="7" style="text-align: center; color: var(--text-muted); padding: 24px;">Không có danh mục nào phù hợp với trạng thái đã chọn.</td>';
                        tbody.appendChild(emptyRow);
                    } else {
                        emptyRow.style.display = '';
                    }
                } else if (emptyRow) {
                    emptyRow.style.display = 'none';
                }
            });
        }
    });
</script>

</body>
</html>

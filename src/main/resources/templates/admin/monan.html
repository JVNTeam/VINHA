<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý món ăn - Vị Nhà Admin</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Admin dùng chung & đồng bộ -->
    <link rel="stylesheet" th:href="@{/css/admin/mon-an.css}">
</head>
<body>

<div class="admin-wrapper">
    <!-- Nhúng Sidebar Fragment đồng bộ -->
    <div th:replace="~{admin/sidebar :: sidebar('monAn')}"></div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="admin-main">

        <!-- Page Header -->
        <div class="page-header">
            <div class="title-group">
                <div class="header-brand-title">
                    <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Vị Nhà Logo" class="header-logo">
                    <h1 class="page-title">Quản lý món ăn</h1>
                </div>
                <p class="page-subtitle">Quản lý danh sách thực đơn, cập nhật giá và số lượng món ăn hệ thống Vị Nhà.</p>
            </div>
            <a th:href="@{/admin/monAn/them}" class="btn-add-new">
                <i class="fas fa-plus"></i> Thêm món ăn mới
            </a>
        </div>

        <!-- Notification Alert -->
        <div th:if="${message}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <!-- Bộ lọc dữ liệu -->
        <div class="filter-card">
            <form id="filterForm" action="" method="GET" class="filter-form">
                <div class="form-group search-group">
                    <label class="filter-label">TÌM KIẾM</label>
                    <input id="searchKeyword" type="text" name="keyword" class="form-control" placeholder="Nhập tên món ăn cần tìm..." th:value="${keyword}" />
                </div>
                <div class="form-group">
                    <label class="filter-label">DANH MỤC</label>
                    <select id="filterCategory" name="category" class="form-control" onchange="document.getElementById('filterForm').submit();">
                        <option value="">Tất cả danh mục</option>
                        <option th:each="dm : ${categories}" th:value="${dm.id}" th:text="${dm.ten}" th:selected="${dm.id == selectedCategory}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="filter-label">TRẠNG THÁI</label>
                    <select id="filterStatus" name="status" class="form-control" onchange="document.getElementById('filterForm').submit();">
                        <option value="">Tất cả trạng thái</option>
                        <option th:each="st : ${statusOptions}" th:value="${st}" th:text="${st}" th:selected="${st == selectedStatus}"></option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button type="submit" class="btn-search">
                        <i class="fa-solid fa-filter"></i> Lọc
                    </button>
                    <a th:href="@{/admin/monAn}" class="btn-refresh" title="Làm mới">
                        <i class="fas fa-rotate-right"></i>
                    </a>
                </div>
            </form>
        </div>

        <!-- Bảng danh sách món ăn -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th class="text-center" width="60">STT</th>
                        <th width="80">HÌNH ẢNH</th>
                        <th>TÊN MÓN</th>
                        <th>DANH MỤC</th>
                        <th class="text-right">GIÁ (VNĐ)</th>
                        <th class="text-center" width="90">CÒN LẠI</th>
                        <th class="text-center" width="90">ĐÃ BÁN</th>
                        <th class="text-center" width="130">TRẠNG THÁI</th>
                        <th class="text-center" width="100">THAO TÁC</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="mon, iterStat : ${monAnList}"
                        th:data-name="${#strings.toLowerCase(mon.ten)}"
                        th:data-category-id="${mon.danhMuc != null ? mon.danhMuc.id : ''}"
                        th:data-category="${mon.danhMuc != null ? #strings.toLowerCase(mon.danhMuc.ten) : 'chưa phân loại'}"
                        th:data-status="${mon.trangThai != null ? #strings.toLowerCase(mon.trangThai) : 'chưa rõ'}">
                        <td class="col-stt text-center" th:text="${iterStat.index + 1}">1</td>
                        <td>
                            <div class="food-thumbnail"
                                 th:style="${#lists.isEmpty(mon.hinhAnhs) or mon.hinhAnhs[0].duongDan == null or mon.hinhAnhs[0].duongDan.trim() == '' ? 'background-image: url(/images/foods/placeholder.png)' : 'background-image: url(' + (mon.hinhAnhs[0].duongDan.startsWith('http') ? mon.hinhAnhs[0].duongDan : (mon.hinhAnhs[0].duongDan.startsWith('/') ? mon.hinhAnhs[0].duongDan : '/' + mon.hinhAnhs[0].duongDan)) + ')'}">
                            </div>
                        </td>
                        <td><strong class="food-title" th:text="${mon.ten}">Tên món ăn</strong></td>
                        <td><span class="category-name" th:text="${mon.danhMuc != null ? mon.danhMuc.ten : 'Chưa phân loại'}">Danh mục</span></td>
                        <td class="text-right">
                            <strong class="price-text" th:text="${mon.gia != null ? #numbers.formatDecimal(mon.gia, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">0 đ</strong>
                        </td>
                        <td class="text-center font-bold" th:text="${mon.soLuongCon}">0</td>
                        <td class="text-center text-muted" th:text="${mon.daBan}">0</td>
                        <td class="text-center">
                            <span class="badge-status"
                                  th:classappend="${mon.trangThai == 'Đang bán' ? 'badge-success' : (mon.trangThai == 'Hết hàng' ? 'badge-warning' : 'badge-danger')}"
                                  th:text="${mon.trangThai != null ? mon.trangThai : 'Chưa rõ'}">Đang bán</span>
                        </td>
                        <td class="text-center">
                            <div class="action-buttons">
                                <a th:href="@{/admin/monAn/sua(id=${mon.id})}" class="icon-btn btn-edit" title="Chỉnh sửa">
                                    <i class="fas fa-pen"></i>
                                </a>
                                <a th:href="@{/admin/monAn/xoa(id=${mon.id})}" class="icon-btn btn-delete" title="Xóa" onclick="return confirm('Bạn có chắc muốn xóa món này?');">
                                    <i class="far fa-trash-alt"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(monAnList)}">
                        <td colspan="9" class="empty-table">Chưa có món ăn nào trong danh sách.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/admin/mon-an.js}"></script>
</body>
</html>

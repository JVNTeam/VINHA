<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản lý hình ảnh - Vị Nhà Admin</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- CSS Admin dùng chung & đồng bộ -->
    <link rel="stylesheet" th:href="@{/css/admin/quanlyhinhanh.css}"/>
</head>
<body>

<div class="admin-wrapper">
    <!-- Nhúng Sidebar Fragment đồng bộ -->
    <div th:replace="~{admin/sidebar :: sidebar('hinhAnh')}"></div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="admin-main">

        <!-- Page Header -->
        <div class="page-header">
            <div class="title-group">
                <div class="header-brand-title">
                    <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Vị Nhà Logo" class="header-logo">
                    <h1 class="page-title">Quản lý hình ảnh món ăn</h1>
                </div>
                <p class="page-subtitle">Cập nhật và quản lý hình ảnh cho thực đơn món ăn của hệ thống Vị Nhà.</p>
            </div>
            <a th:href="@{/admin/hinhAnh/them}" class="btn-add-new">
                <i class="fa-regular fa-image"></i> Thêm hình ảnh mới
            </a>
        </div>

        <!-- Notification Alerts -->
        <div th:if="${message}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <!-- Bộ Lọc Dữ Liệu -->
        <div class="filter-card">
            <form th:action="@{/admin/hinhAnh}" method="get" class="filter-form">
                <div class="form-group search-group">
                    <label class="filter-label">TÌM KIẾM MÓN ĂN</label>
                    <div class="search-input-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên món ăn..."/>
                    </div>
                </div>

                <div class="form-group">
                    <label class="filter-label">DANH MỤC</label>
                    <select name="category" class="form-control">
                        <option value="">Tất cả danh mục</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat}"
                                th:text="${cat}"
                                th:selected="${cat == selectedCategory}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="filter-label">TRẠNG THÁI ÁNH</label>
                    <select name="status" class="form-control">
                        <option value="">Tất cả trạng thái</option>
                        <option th:each="st : ${statusOptions}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${st == selectedStatus}">
                        </option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button type="submit" class="btn-search">
                        <i class="fa-solid fa-filter"></i> Lọc
                    </button>
                    <a th:href="@{/admin/hinhAnh}" class="btn-refresh" title="Làm mới">
                        <i class="fas fa-rotate-right"></i>
                    </a>
                </div>
            </form>
        </div>

        <!-- Bảng Dữ Liệu Hình Ảnh -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th class="text-center" width="60">STT</th>
                        <th width="200">MÓN ĂN</th>
                        <th width="150">DANH MỤC</th>
                        <th class="text-center" width="120">HÌNH ẢNH</th>
                        <th>ĐƯỜNG DẪN HÌNH ÁNH</th>
                        <th class="text-center" width="130">TRẠNG THÁI</th>
                        <th class="text-center" width="100">THAO TÁC</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, iterStat : ${imageList}"
                        th:data-dish="${item.monAn != null ? item.monAn.ten.toLowerCase() : ''}"
                        th:data-category="${item.monAn != null and item.monAn.danhMuc != null ? item.monAn.danhMuc.ten.toLowerCase() : 'chưa phân loại'}"
                        th:data-status="${item.trangThai != null ? item.trangThai.toLowerCase() : ''}">
                        <td class="col-stt text-center" th:text="${iterStat.index + 1}">1</td>
                        <td><strong class="food-title" th:text="${item.monAn != null ? item.monAn.ten : 'Chưa gán món'}">Cơm Gà Xối Mỡ</strong></td>
                        <td><span class="category-name" th:text="${item.monAn != null and item.monAn.danhMuc != null ? item.monAn.danhMuc.ten : 'Chưa phân loại'}">Món Cơm</span></td>
                        <td class="text-center">
                            <div class="dish-preview-container">
                                <img th:if="${item.duongDan != null and item.duongDan.trim() != ''}"
                                     th:src="@{${item.duongDan.startsWith('http') ? item.duongDan : (item.duongDan.startsWith('/') ? item.duongDan : '/' + item.duongDan)}}"
                                     alt="Hình món ăn"
                                     class="dish-preview-img"
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"/>
                                <div th:if="${item.duongDan == null or item.duongDan.trim() == ''}" class="dish-preview-placeholder">
                                    Chưa có ảnh
                                </div>
                            </div>
                        </td>
                        <td>
                            <code class="path-code" th:text="${item.duongDan != null ? item.duongDan : '/images/placeholder.png'}">/uploads/com-ga-xoi-mo.jpg</code>
                        </td>
                        <td class="text-center">
                            <span class="badge-status"
                                  th:classappend="${item.trangThai == 'Mở' or item.trangThai == 'Hoạt động' ? 'badge-success' : 'badge-danger'}"
                                  th:text="${item.trangThai != null ? item.trangThai : 'Khóa'}">Mở</span>
                        </td>
                        <td class="text-center">
                            <div class="action-buttons">
                                <a th:href="@{/admin/hinhAnh/sua(id=${item.id})}" class="icon-btn btn-edit" title="Sửa"><i class="fa-regular fa-pen-to-square"></i></a>
                                <a th:href="@{/admin/hinhAnh/xoa(id=${item.id})}" class="icon-btn btn-delete" title="Xóa" onclick="return confirm('Bạn có chắc muốn xóa ảnh này?');"><i class="fa-regular fa-trash-can"></i></a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(imageList)}" class="no-results">
                        <td colspan="7" class="empty-table">Không tìm thấy dữ liệu hình ảnh phù hợp.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    const searchInput = document.querySelector('input[name="keyword"]');
    const categorySelect = document.querySelector('select[name="category"]');
    const statusSelect = document.querySelector('select[name="status"]');
    const tableRows = document.querySelectorAll('tbody tr:not(.no-results)');
    const noResultsRow = document.querySelector('tbody .no-results');

    function applyTableFilter() {
        const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';
        const category = categorySelect ? categorySelect.value.trim().toLowerCase() : '';
        const status = statusSelect ? statusSelect.value.trim().toLowerCase() : '';

        let visibleCount = 0;

        tableRows.forEach(row => {
            const dish = row.dataset.dish || '';
            const cat = row.dataset.category || '';
            const st = row.dataset.status || '';

            const matchesKeyword = !keyword || dish.includes(keyword);
            const matchesCategory = !category || category === cat;
            const matchesStatus = !status || status === st;

            if (matchesKeyword && matchesCategory && matchesStatus) {
                row.style.display = '';
                visibleCount++;
            } else {
                row.style.display = 'none';
            }
        });

        if (noResultsRow) {
            noResultsRow.style.display = visibleCount === 0 ? '' : 'none';
        }
    }

    if (searchInput && categorySelect && statusSelect) {
        searchInput.addEventListener('input', applyTableFilter);
        categorySelect.addEventListener('change', applyTableFilter);
        statusSelect.addEventListener('change', applyTableFilter);
        window.addEventListener('DOMContentLoaded', applyTableFilter);
    }
</script>
</body>
</html>
